[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoda-agent"
version = "0.5.80"
description = "多智能体 AI 助手 — 40+ 工具赋能，三通道交互"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Xiaoda Agent Team"},
]
keywords = ["ai", "agent", "chatbot", "qq-bot", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "fastapi>=0.115.0",
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "python-multipart>=0.0.12",
    "httpx[http2]>=0.27.0",
    "Pillow>=10.4.0",
    "qrcode>=7.4.0",
    "numpy>=1.26.0",
    "prompt-toolkit>=3.0.0",
    "pilk>=0.2.4",
    "python-dotenv>=1.2.2",
    "loguru>=0.7.3",
    "structlog>=24.0.0",
    "openai>=2.41.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.13.4",
    "jieba>=0.42.1",
    "rapidfuzz>=3.0.0",
    "pyyaml>=6.0",
    "cryptography>=43.0.0",
    "certifi>=2024.7.0",
    "qq-botpy>=1.2.1",
    "pdfplumber>=0.11.9",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "html2text>=2025.4.15",
    "pywebview>=5.0",
    "psutil>=6.0.0",
    "distro>=1.9.0",
    "prometheus-client>=0.20.0",
    "networkx>=3.2",
    "requests>=2.31.0",
    "primp>=0.7.0",
    "tavily-python>=0.5.0",
    "lxml>=5.0.0",
    "sqlite-vec>=0.1.0",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
streamlit = ["streamlit>=1.28.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-timeout>=2.3", "pytest-cov>=6.0", "ruff>=0.1.0", "libcst>=1.0"]
search = []
windows = ["pywin32>=306", "pywinpty>=2.0.10"]  # ConPTY 真终端（虚空终端 resize/TUI）
local-ai = ["onnxruntime-genai==0.15.2; python_version >= '3.11' and ((platform_system == 'Windows' and platform_machine == 'AMD64') or (platform_system == 'Linux' and platform_machine == 'x86_64') or (platform_system == 'Linux' and platform_machine == 'aarch64'))"]

[project.scripts]
xiaoda-agent = "agent:main"

# ── 根目录单文件模块 ─────────────────────────────────────────
# console script 指向 agent:main，但 packages.find 只收「包」，不含仓库根目录的
# 单文件模块——此前 pip install 后入口 ModuleNotFoundError（已实证）。
# 显式声明全部被 import 的顶层模块（宁可全列不可漏；由
# tests/test_windows_package_reliability.py::test_py_modules_cover_every_imported_root_module
# 守护：AST 扫描源码树，漏列即红）。与 PyInstaller spec 无冲突：spec 直接引用
# 源文件路径，不经 setuptools 打包。
[tool.setuptools]
py-modules = [
    "agent",
    "agent_context",
    "agent_dispatcher",
    "belief_router",
    "botpy_compat",
    "channel_adapter_base",
    "cli",
    "cli_client",
    "cli_menu",
    "cli_palette",
    "config",
    "config_agents",
    "config_constants",
    "config_paths",
    "config_providers",
    "hooks",
    "ilink_client",
    "instinct_manager",
    "model_router",
    "model_router_config",
    "model_router_registry",
    "qq_bot_adapter",
    "setup_wizard",
    "slash_commands",
    "wechat_bot_adapter",
    "xiaoli_agent",
]

[tool.setuptools.packages.find]
# 注意：config/ 目录是「数据目录」不是 Python 包（无 __init__.py），
# 但 config* 通配会把它的 json5/yaml/md 当作包数据装进 site-packages/config/
# （namespace 包语义），遮蔽源码树根的 config.py。显式排除，只保留真包。
exclude = ["config", "config.*"]
include = [
    "agent*",
    "agent_core*",
    "agent_context*",
    "agent_dispatcher*",
    "belief_router*",
    "cli*",
    "cli_client*",
    "config*",
    "hooks*",
    "instinct_manager*",
    "llm_gateway*",
    "local_ai*",
    "xiaoli_agent*",
    "model_router*",
    "prompt_builder*",
    "qq_bot_adapter*",
    "setup_wizard*",
    "slash_commands*",
    "task_orchestrator*",
    "tool_call_handler*",
    "core*",
    "core_runtime*",
    "db*",
    "emotion*",
    "memory*",
    "plugins*",
    "security*",
    "tool_engine*",
    "tools*",
    "transports*",
    "utils*",
    "web*",
]

[tool.setuptools.package-data]
"*" = ["*.sql", "*.json5", "*.json", "*.md", "*.yaml", "*.yml"]
"web" = ["dist/**/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agent_core", "agent_context", "config", "core", "web", "security", "memory", "tools", "tool_engine", "emotion"]
