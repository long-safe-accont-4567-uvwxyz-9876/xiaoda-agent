name: CI Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      # 允许 coverage-comment-action 发布 PR 评论
      pull-requests: write
      # 允许更新 python-coverage-comment-action-data 分支与编辑已发布评论
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system dependencies
        # ffmpeg/ffprobe：test_dynamic_wallpaper 转码用例需要真实二进制
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev ffmpeg

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -q
          # lock 完整性最低要求：安装后依赖图无冲突（版本声明 vs 实际解析）
          pip check

      # test_frontend_local_ai_contracts / test_frontend_provider_contracts 需要
      # web/frontend/node_modules 的 esbuild 打包前端模块（与 build-release.yml 对齐）
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install frontend deps for tests
        working-directory: web/frontend
        run: npm ci

      - name: Create test environment
        run: |
          # 创建必要的目录
          mkdir -p ~/.ai-agent/logs
          mkdir -p ~/.ai-agent/workspace
          mkdir -p ~/.ai-agent/config/agents
          mkdir -p ~/.ai-agent/data/db

          # 复制配置文件
          cp -r config/workspace ~/.ai-agent/workspace/
          cp -r config/agents/*.json ~/.ai-agent/config/agents/ 2>/dev/null || true

      - name: Version sync check
        run: python scripts/check_version_sync.py --ci

      # 2026-08-24 门禁复审：
      # 1) 不再用 `| tail -50` —— 管道会吞掉 pytest 的退出码（exit 4 曾被吞为 0 假绿）。
      #    输出截断交给 GitHub Actions 折叠日志，失败必须让 step 红。
      # 2) 不再 --deselect tests/test_a4_rag_root_fix.py：该用例在 CI 失败是因
      #    CI 环境预置了 INTENT_LLM_CLASSIFY=true；用例已改为显式清空该环境变量
      #    （fail on 真实默认值漂移，而非 fail on 环境差异），全集直接跑。
      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=. --cov-report=term-missing --cov-report=json:coverage.json \
            -m "not slow and not e2e_real" \
            --timeout=60 \
            -q

      - name: Run critical tests (strict)
        run: |
          # 单一事实源：scripts/critical_tests.txt（与 pre-push / build-release 共用）
          python -m pytest \
            $(grep -vE '^\s*(#|$)' scripts/critical_tests.txt) \
            -v --tb=short

      - name: Coverage summary
        if: always()
        run: |
          echo "=== Coverage Summary ==="
          if [ -f coverage.json ]; then
            python -c "import json; d=json.load(open('coverage.json')); t=d.get('totals',{}); print(f'Line coverage: {t.get(chr(99)+chr(111)+chr(118)+chr(101)+chr(114)+chr(101)+chr(100)+chr(95)+chr(108)+chr(105)+chr(110)+chr(101)+chr(115),0)}/{t.get(chr(110)+chr(117)+chr(109)+chr(95)+chr(115)+chr(116)+chr(97)+chr(116)+chr(101)+chr(109)+chr(101)+chr(110)+chr(116)+chr(115),0)} = {t.get(chr(112)+chr(101)+chr(114)+chr(99)+chr(101)+chr(110)+chr(116)+chr(95)+chr(99)+chr(111)+chr(118)+chr(101)+chr(114)+chr(101)+chr(100),0):.1f}%')"
          else
            echo "No coverage data found."
          fi

      - name: Coverage comment
        id: coverage_comment
        if: always() && github.event_name == 'pull_request' && hashFiles('.coverage') != ''
        uses: py-cov-action/python-coverage-comment-action@50d15ff8768f6d897b04e5a0805bd1a98f7096c4 # v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          # 低于 50% 为红色徽章，50-100% 为橙色（PR 评论会显示覆盖率 evolution）
          MINIMUM_ORANGE: 50
          # 标注缺失覆盖的行（warning 级别，不阻塞 PR）
          ANNOTATE_MISSING_LINES: true
          ANNOTATION_TYPE: warning
        continue-on-error: true

      - name: Coverage drop warning
        if: always() && github.event_name == 'pull_request' && steps.coverage_comment.outputs.reference_percent_covered != ''
        shell: bash
        env:
          REF_COV: ${{ steps.coverage_comment.outputs.reference_percent_covered }}
          NEW_COV: ${{ steps.coverage_comment.outputs.new_percent_covered }}
        # 调用独立脚本, 避免 python -c "..." 多行代码在 YAML literal block 中
        # 因缩进为 0 而破坏 literal block scalar 的解析问题.
        run: python scripts/check_coverage_drop.py "$REF_COV" "$NEW_COV"
        continue-on-error: true

      - name: Store Pull Request comment artifact
        if: always() && steps.coverage_comment.outputs.comment_file_written == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
        continue-on-error: true

      - name: Test summary
        if: always()
        run: |
          echo "=== Test Summary ==="
          echo "CI tests completed. Check results above."

  frontend-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      - name: Install frontend deps
        working-directory: web/frontend
        run: npm ci

      - name: Typecheck frontend (vue-tsc)
        working-directory: web/frontend
        run: npm run typecheck

      - name: Check i18n key parity
        working-directory: web/frontend
        run: npm run check:i18n

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install lint tools
        run: pip install ruff -q

      - name: Run Ruff check
        run: |
          # E9/F63/F7/F82 = 语法错误与崩溃级问题。pyproject 已声明 E/F/W/I 全集，
          # 但存量 E402/F822 尚未清偿，收敛前先用崩溃子集把门（2026-08-23 复审记录）。
          ruff check . --select=E9,F63,F7,F82 --output-format=github

      - name: Python syntax check
        run: |
          python -m py_compile agent.py agent_context.py config.py
          echo "Syntax check completed."

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: pip install bandit pip-audit -q

      # 2026-08-24 门禁化：移除 || true（此前扫描失败被吞，security job 永远绿）。
      # 规则：HIGH 计数 > scripts/security_baseline.json 的 high_count 即红；
      # 基线内已登记的豁免条目（带 reason）不计入。新增 HIGH 必须修掉或
      # 在 baseline 中登记豁免理由。
      - name: Run Bandit security scan
        run: |
          bandit -r . -x ./tests,./chaos,./.venv,./node_modules -f json -o bandit-report.json || echo "bandit exited $? (findings present), gating below"
          python scripts/security_gate.py bandit-report.json

      - name: Run pip-audit dependency scan (gate on HIGH/CRITICAL)
        run: |
          pip install -r requirements.lock -q
          # pip-audit 发现漏洞时退出码非 0；报告落盘后由门禁脚本按 CRITICAL/HIGH 计数判定，
          # 避免直接把非零退出当失败导致无法输出差异明细
          pip-audit -r requirements.lock --desc -f json -o pip-audit-report.json || echo "pip-audit exited $? (vulnerabilities present), gating below"
          python scripts/security_gate.py pip-audit-report.json

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          if-no-files-found: ignore

      - name: Security summary
        if: always()
        run: |
          echo "=== Security Scan Summary ==="
          if [ -f bandit-report.json ]; then
            python -c "import json; d=json.load(open('bandit-report.json')); h=len([r for r in d.get('results',[]) if r.get('issue_severity')=='HIGH']); m=len([r for r in d.get('results',[]) if r.get('issue_severity')=='MEDIUM']); print(f'HIGH: {h} issues, MEDIUM: {m} issues')"
          else
            echo "No bandit report found."
          fi